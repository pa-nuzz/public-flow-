{% extends "base.html" %}
{% block title %}Password Reset Complete — MailFlow AI{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-20 px-4 bg-slate-50">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-xl mx-auto mb-4 shadow-lg shadow-indigo-500/30">M</div>
      <h1 class="text-2xl font-extrabold text-slate-900">Password set!</h1>
      <p class="text-sm text-slate-500 mt-1">Your password has been set. You may go ahead and log in now.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
      <a href="{% url 'login' %}" class="block w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-all text-sm text-center">
        Log in
      </a>
    </div>
  </div>
</section>
{% endblock %}
