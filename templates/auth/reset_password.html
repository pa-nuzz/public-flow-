{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password — MailFlow AI{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-20 px-4 bg-slate-50">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-xl mx-auto mb-4 shadow-lg shadow-indigo-500/30">M</div>
      <h1 class="text-2xl font-extrabold text-slate-900">Forgot your password?</h1>
      <p class="text-sm text-slate-500 mt-1 max-w-xs mx-auto">Enter your email and we'll send you a link to reset your password.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
      <form method="POST" action="/auth/reset-password/" novalidate>
        {% csrf_token %}

        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" />
        </div>

        <button type="submit"
          class="w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md shadow-indigo-500/20 transition-all hover:-translate-y-0.5 text-sm">
          Send Reset Link
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Remembered it?
        <a href="/auth/login/" class="font-semibold text-primary hover:text-indigo-700 transition-colors">Back to login</a>
      </p>
    </div>

  </div>
</section>
{% endblock %}
